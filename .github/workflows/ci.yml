name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

      # The package must stay installable with no private registry access.
      - name: Check for non-public dependencies
        run: |
          if grep -qE '"(@tmrxjd|workspace:)' package.json; then
            echo "package.json references a workspace or private dependency"
            exit 1
          fi
